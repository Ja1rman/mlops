name: Runbook Search delivery

on:
  push:
    branches: [main]
    paths: ["lab2/**", ".github/workflows/search-delivery.yml"]
  pull_request:
    paths: ["lab2/**", ".github/workflows/search-delivery.yml"]
  workflow_dispatch:
    inputs:
      reverse_drill:
        description: Exercise semantic rollback after the approved production promotion
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: search-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  HELM_DRIVER: configmap
  SEARCH_IMAGE_REPOSITORY: docker.io/jairman/ovsyannikov-runbook-search

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.image.outputs.deploy }}
      digest: ${{ steps.image.outputs.digest }}
    defaults:
      run:
        shell: bash
        working-directory: lab2
    steps:
      - &checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab2/requirements.txt
      - run: make test quality negative
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: search-quality
          path: |
            lab2/artifacts/metadata.json
            lab2/artifacts/quality.json
            lab2/artifacts/quality-reverse.json

      - name: Build and publish image
        id: image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HAS_KUBECONFIG: ${{ secrets.KUBE_CONFIG_B64 != '' }}
        run: |
          build_args=(--platform linux/amd64 --tag "$SEARCH_IMAGE_REPOSITORY:$GITHUB_SHA")
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            docker buildx build "${build_args[@]}" --load .
            echo 'Image built locally. Publication requires DOCKERHUB_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/search-docker.XXXXXX")
          export DOCKER_CONFIG
          trap 'docker logout >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username jairman --password-stdin
          unset DOCKERHUB_TOKEN

          metadata="$DOCKER_CONFIG/build.json"
          docker buildx build "${build_args[@]}" --push --metadata-file "$metadata" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$metadata")
          docker buildx imagetools inspect "$SEARCH_IMAGE_REPOSITORY@$digest"
          jq -n --arg repository "$SEARCH_IMAGE_REPOSITORY" --arg tag "$GITHUB_SHA" \
            --arg digest "$digest" '{repository: $repository, tag: $tag, digest: $digest}' \
            | tee image.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_KUBECONFIG" == true ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Staging and production are skipped until KUBE_CONFIG_B64 is configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.image.outputs.digest != ''
        with:
          name: search-image
          path: lab2/image.json

  staging:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps: &deploy_steps
      - *checkout
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - name: Deploy and verify
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REVERSE_DRILL: ${{ inputs.reverse_drill }}
        run: |
          : "${KUBE_CONFIG_B64:?Configure the KUBE_CONFIG_B64 Actions secret}"
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/search-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG"
          unset KUBE_CONFIG_B64
          # The staging and production job IDs match the script's environment names.
          if [[ "$GITHUB_JOB" == production && "$REVERSE_DRILL" == true ]]; then
            set -- --reverse-drill
          fi
          lab2/scripts/deploy_release.sh "$GITHUB_JOB" "$SEARCH_IMAGE_REPOSITORY" "$IMAGE_DIGEST" "$GITHUB_SHA" "$@" \
            2>&1 | tee "$GITHUB_JOB.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: search-${{ github.job }}
          path: ${{ github.job }}.log

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production
    steps: *deploy_steps

name: Runbook Search delivery

on:
  push:
    branches: [main]
    paths: ["lab2/**", ".github/workflows/search-delivery.yml"]
  pull_request:
    paths: ["lab2/**", ".github/workflows/search-delivery.yml"]
  workflow_dispatch:
    inputs:
      reverse_drill:
        description: Exercise semantic rollback after the approved production promotion
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: search-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  HELM_DRIVER: configmap
  SEARCH_IMAGE_REPOSITORY: docker.io/jairman/ovsyannikov-runbook-search

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2
    steps:
      - &checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab2/requirements.txt
      - run: make test quality negative
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: search-quality
          path: |
            lab2/artifacts/metadata.json
            lab2/artifacts/quality.json
            lab2/artifacts/quality-reverse.json

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.config.outputs.deploy }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check delivery configuration
        id: config
        shell: bash
        env:
          HAS_REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          HAS_KUBECONFIG: ${{ secrets.KUBE_CONFIG_B64 != '' }}
        run: |
          deploy=false
          if [[ "$HAS_REGISTRY_TOKEN" != true ]]; then
            echo 'Image build only. Add the DOCKERHUB_TOKEN Actions secret to enable publication.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$HAS_KUBECONFIG" != true ]]; then
            echo 'Image publication enabled. Staging and production are skipped until KUBE_CONFIG_B64 is configured.' >> "$GITHUB_STEP_SUMMARY"
          else
            deploy=true
            echo 'Image publication and Kubernetes delivery are enabled.' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'publish=%s\ndeploy=%s\n' "$HAS_REGISTRY_TOKEN" "$deploy" >> "$GITHUB_OUTPUT"
      - *checkout
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        if: steps.config.outputs.publish == 'true'
        with:
          username: jairman
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build container
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6.17.0
        with:
          context: ./lab2
          push: ${{ steps.config.outputs.publish == 'true' }}
          platforms: linux/amd64
          tags: ${{ env.SEARCH_IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Record image digest
        if: steps.config.outputs.publish == 'true'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect "$SEARCH_IMAGE_REPOSITORY@$IMAGE_DIGEST"
          jq -n --arg repository "$SEARCH_IMAGE_REPOSITORY" --arg tag "$GITHUB_SHA" \
            --arg digest "$IMAGE_DIGEST" '{repository: $repository, tag: $tag, digest: $digest}' \
            | tee image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.config.outputs.publish == 'true'
        with:
          name: search-image
          path: image.json

  staging:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps: &deploy_steps
      - *checkout
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - name: Deploy and verify
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REVERSE_DRILL: ${{ inputs.reverse_drill }}
        run: |
          if [[ -z "$KUBE_CONFIG_B64" ]]; then
            echo "Configure the KUBE_CONFIG_B64 Actions secret" >&2
            exit 1
          fi
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/search-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG"
          unset KUBE_CONFIG_B64
          # The staging and production job IDs match the script's environment names.
          if [[ "$GITHUB_JOB" == production && "$REVERSE_DRILL" == true ]]; then
            set -- --reverse-drill
          fi
          lab2/scripts/deploy_release.sh "$GITHUB_JOB" "$SEARCH_IMAGE_REPOSITORY" "$IMAGE_DIGEST" "$GITHUB_SHA" "$@" \
            2>&1 | tee "$GITHUB_JOB.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: search-${{ github.job }}
          path: ${{ github.job }}.log

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production
    steps: *deploy_steps

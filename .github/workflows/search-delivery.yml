name: Runbook Search delivery

on:
  push:
    branches: [main]
    paths: ["lab2/**", ".github/workflows/search-delivery.yml"]
  pull_request:
    paths: ["lab2/**", ".github/workflows/search-delivery.yml"]
  workflow_dispatch:
    inputs:
      reverse_drill:
        description: Exercise semantic rollback after the approved production promotion
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: search-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  HELM_DRIVER: configmap
  SEARCH_IMAGE_REPOSITORY: docker.io/jairman/ovsyannikov-runbook-search

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab2/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_index.py --output artifacts
      - run: python -m pytest -q
      - name: Quality gate
        shell: bash
        run: python scripts/evaluate.py --artifact-dir artifacts | tee artifacts/quality.json
      - name: Negative quality control
        shell: bash
        run: |
          status=0
          python scripts/evaluate.py --artifact-dir artifacts --ranking-mode reverse \
            > artifacts/quality-reverse.json || status=$?
          cat artifacts/quality-reverse.json
          if [[ "$status" != 2 ]]; then
            echo "Expected quality gate rejection with exit 2, got $status" >&2
            exit 1
          fi
          echo "Reverse candidate blocked by quality gate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: search-quality
          path: |
            lab2/artifacts/metadata.json
            lab2/artifacts/quality.json
            lab2/artifacts/quality-reverse.json

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.image.outputs.repository }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        if: github.event_name == 'workflow_dispatch'
        with:
          username: jairman
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set image repository
        id: image
        shell: bash
        run: echo "repository=$SEARCH_IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
      - name: Build container
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6.17.0
        with:
          context: ./lab2
          push: ${{ github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Record image digest
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          jq -n --arg repository "$IMAGE_REPOSITORY" --arg tag "$GITHUB_SHA" \
            --arg digest "$IMAGE_DIGEST" '{repository: $repository, tag: $tag, digest: $digest}' \
            | tee image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: search-image
          path: image.json

  staging:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - name: Deploy staging and verify
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          IMAGE_REPOSITORY: ${{ needs.build.outputs.repository }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          if [[ -z "$KUBE_CONFIG_B64" ]]; then
            echo "Configure the KUBE_CONFIG_B64 Actions secret" >&2
            exit 1
          fi
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/search-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG"
          unset KUBE_CONFIG_B64
          lab2/scripts/deploy_release.sh staging "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" "$GITHUB_SHA" \
            2>&1 | tee staging.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: search-staging
          path: staging.log

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify production approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            | jq -e 'any(.[]; .state == "approved" and any(.environments[]; .name == "production"))' > /dev/null; then
            echo "Production requires an approval from the GitHub environment reviewers" >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - name: Promote production and verify
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          IMAGE_REPOSITORY: ${{ needs.build.outputs.repository }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REVERSE_DRILL: ${{ inputs.reverse_drill }}
        run: |
          if [[ -z "$KUBE_CONFIG_B64" ]]; then
            echo "Configure the KUBE_CONFIG_B64 Actions secret" >&2
            exit 1
          fi
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/search-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG"
          unset KUBE_CONFIG_B64
          if [[ "$REVERSE_DRILL" == true ]]; then
            set -- --reverse-drill
          fi
          lab2/scripts/deploy_release.sh production "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" "$GITHUB_SHA" "$@" \
            2>&1 | tee production.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: search-production
          path: production.log

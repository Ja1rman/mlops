name: Line RAG CI

on:
  push:
    branches: [main]
    paths: ["lab3/**", ".github/workflows/line-ci.yml"]
  pull_request:
    paths: ["lab3/**", ".github/workflows/line-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, mlops-build]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test application code
        working-directory: lab3
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          python -m pip install --no-cache-dir -r kb/requirements.txt -r portal/requirements.txt
          python -m unittest discover -s kb/tests
          python -m unittest discover -s portal -p 'test_*.py'
      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize lab3/deploy > "$RUNNER_TEMP/line-manifests.yaml"
          printf '\n---\n' >> "$RUNNER_TEMP/line-manifests.yaml"
          cat lab3/deploy/demo.yaml >> "$RUNNER_TEMP/line-manifests.yaml"
          docker run --rm -i --entrypoint /kubeconform ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary \
            < "$RUNNER_TEMP/line-manifests.yaml"
      - name: Build containers
        run: |
          docker build -f lab3/kb/Dockerfile -t line-kb:ci lab3
          docker build -t line-portal:ci lab3/portal
          docker build -t line-mock:ci lab3/mock
      - name: Check MCP and portal integration
        env:
          MCP_TOKEN: isolated-ci-test
        run: |
          cleanup() {
            docker logs ci-kb || true
            docker logs ci-portal || true
            docker rm -f ci-kb ci-mock ci-portal || true
            docker network rm line-ci || true
          }
          trap cleanup EXIT
          docker network create line-ci
          docker run -d --name ci-kb --network line-ci --network-alias kb-mcp \
            -p 127.0.0.1:18001:8000 -e MCP_TOKEN line-kb:ci
          docker run -d --name ci-mock --network line-ci line-mock:ci
          docker run -d --name ci-portal --network line-ci -p 127.0.0.1:18000:8000 \
            -e MCP_TOKEN -e MCP_URL=http://kb-mcp:8000/mcp \
            -e CLOUD_BASE_URL=http://ci-mock:8000/v1 -e LLM7_API_KEY=demo-only line-portal:ci

          curl -fsS --max-time 5 --retry 25 --retry-all-errors --retry-delay 1 http://127.0.0.1:18001/readyz
          (cd lab3 && .venv/bin/python -m kb.smoke http://127.0.0.1:18001/mcp)
          curl -fsS --max-time 5 --retry 25 --retry-all-errors --retry-delay 1 http://127.0.0.1:18000/readyz
          payload='{"query":"Сколько активных подписчиков помещается в закрытый канал сейчас?"}'
          curl -fsS --max-time 5 http://127.0.0.1:18000/api/search -H 'Content-Type: application/json' \
            --data "$payload" | jq -e 'any(.cards[]; .doc_id == "M-05" and .version == "2.0")'
          curl -fsS --max-time 10 http://127.0.0.1:18000/api/ask -H 'Content-Type: application/json' \
            --data "$payload" | jq -e '.route == "cloud" and any(.sources[]; .url == "/docs/M-05/2.0#s01")'
      - name: Publish images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/line-docker.XXXXXX")
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username jairman --password-stdin
          unset DOCKERHUB_TOKEN
          for pair in kb:kb-mcp portal:portal mock:cloud-mock; do
            image="docker.io/jairman/line-${pair#*:}:$GITHUB_SHA"
            docker tag "line-${pair%%:*}:ci" "$image"
            docker push "$image"
          done
      - name: Clean Python environment
        if: always()
        run: rm -rf lab3/.venv

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: [self-hosted, Linux, X64, lonecraft-back, mlops]
    timeout-minutes: 10
    concurrency: line-deploy
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Deploy and check readiness
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/line-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG"
          unset KUBE_CONFIG_B64
          if ! kubectl -n itmo-student-03 get secret line-mcp >/dev/null 2>&1; then
            openssl rand -hex 32 | tr -d '\n' | kubectl -n itmo-student-03 create secret generic line-mcp --from-file=MCP_TOKEN=/dev/stdin
          fi
          cd lab3/deploy
          printf '  - demo.yaml\nimages:\n' >> kustomization.yaml
          for image in kb-mcp portal cloud-mock; do
            printf '  - name: docker.io/jairman/line-%s\n    newTag: %s\n' "$image" "$GITHUB_SHA" >> kustomization.yaml
          done
          kubectl apply -k .
          for service in llm-local kb-mcp portal cloud-mock portal-demo; do
            kubectl -n itmo-student-03 rollout status "deployment/$service" --timeout=5m
          done

apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-local
  namespace: itmo-student-03
data:
  LOCAL_MODEL: qwen2.5:1.5b-instruct-q4_K_M
  HOME: /ollama
  OLLAMA_MODELS: /ollama/models
  OLLAMA_CONTEXT_LENGTH: "2048"
  OLLAMA_NUM_PARALLEL: "1"
  OLLAMA_MAX_LOADED_MODELS: "1"
  OLLAMA_MAX_QUEUE: "1"
  OLLAMA_VULKAN: "0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-local-models
  namespace: itmo-student-03
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cloudru-ssd
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-local
  namespace: itmo-student-03
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-local
  template:
    metadata:
      labels:
        app: llm-local
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: pull-model
          image: docker.io/alpine/ollama:0.40.16
          envFrom:
            - configMapRef:
                name: llm-local
          env:
            - name: OLLAMA_HOST
              value: 127.0.0.1:11434
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ollama serve &
              server=$!
              trap 'kill "$server" 2>/dev/null || true' EXIT
              for _attempt in $(seq 1 30); do
                if ollama list >/dev/null 2>&1; then
                  ollama show "$LOCAL_MODEL" >/dev/null || ollama pull "$LOCAL_MODEL"
                  exit 0
                fi
                sleep 1
              done
              echo 'Ollama did not start within 30 seconds' >&2
              exit 1
          volumeMounts:
            - name: models
              mountPath: /ollama
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      containers:
        - name: ollama
          image: docker.io/alpine/ollama:0.40.16
          args: [serve]
          envFrom:
            - configMapRef:
                name: llm-local
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_NO_CLOUD
              value: "true"
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests: {cpu: 750m, memory: 1536Mi}
            limits: {cpu: 1500m, memory: 2304Mi}
          volumeMounts:
            - name: models
              mountPath: /ollama
          startupProbe:
            httpGet: {path: /api/version, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/version, port: http}
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", 'OLLAMA_HOST=127.0.0.1:11434 ollama show "$LOCAL_MODEL" >/dev/null']
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-local-models
---
apiVersion: v1
kind: Service
metadata:
  name: llm-local
  namespace: itmo-student-03
spec:
  selector:
    app: llm-local
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-local
  namespace: itmo-student-03
spec:
  podSelector:
    matchLabels: {app: llm-local}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [portal, portal-demo]
      ports: [{protocol: TCP, port: 11434}]
